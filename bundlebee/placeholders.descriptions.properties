#
# This file holds the documentation of placeholders used in alveoli.
#
namespace.name = Application Kubernetes namespace.

service.account.name = Service account name injected in deployments if not specified for the service specifically.
service.probes.liveness.path = Default path for liveness check for deployments if not specified for the service specifically.
service.probes.liveness.port = Default port for liveness check for deployments if not specified for the service specifically.
service.probes.readiness.path = Default path for readiness check for deployments if not specified for the service specifically.
service.probes.readiness.port = Default port for readiness check for deployments if not specified for the service specifically.
service.replicas  = Default number of requested instances for deployments if not specified for the service specifically.
service.resources.requests.cpu = Default requested CPU if not specified for the service specifically.
service.resources.requests.memory = Default requested memory if not specified for the service specifically.
citelibre.public.url = Public base URL of the ingress as seen by the browser (no trailing slash), used for Lutece URLs and the Keycloak hostname.
citelibre.public.https = 1 when the public URL is served over HTTPS (Lutece `LUTECE_HTTPS_SUPPORT`).
citelibre.ingress.class = Ingress class used by the CiteLibre ingress.
citelibre-keycloak.version = Keycloak image version.
citelibre-keycloak.replicas = Keycloak replicas.
citelibre-keycloak.database = Keycloak database name in the shared MariaDB.
citelibre-keycloak.backoffice.client.secret = Secret of the `monadmin` OAuth2 client (realm `citelibre_backoffice`).
citelibre-keycloak.frontoffice.client.secret = Secret of the `moncompte` OAuth2 client (realm `citelibre_frontoffice`).
citelibre-rendezvous.version = CiteLibre RendezVous image version.
citelibre-rendezvous.database = RendezVous database name in the shared MariaDB.
dbinit.name = Name of the database init job, also the folder of its SQL files under `bundlebee/resources/sql`.
dbinit.database = Database created and initialized by the init job.
dbinit.host = MariaDB host used by the init job.
dbinit.backoffLimit = Retries of the init job.
dbinit.ttlSecondsAfterFinished = Seconds before a finished init job is garbage collected.
citelibre.dns.ndots = `ndots` DNS option of the CiteLibre pods.
